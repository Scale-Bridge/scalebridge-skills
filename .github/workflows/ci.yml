name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete content tree
        run: |
          test -d skills && ls skills/*/SKILL.md >/dev/null
          test -d agents && ls agents/*.md >/dev/null
          test -f scripts/sync-hermes.sh
          test -f .claude-plugin/plugin.json && test -f .claude-plugin/marketplace.json
          test -f README.md && test -f LICENSE

      - name: Validate JSON manifests
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
      - name: Skill + agent frontmatter present
        run: |
          fail=0
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::missing frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::missing name"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::missing description"; fail=1; }
          done
          exit $fail
      - name: Shell lint sync script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck scripts/sync-hermes.sh
          bash -n scripts/sync-hermes.sh
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      - name: No tool attribution in the PR's commits
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --format='%s%n%b' "$RANGE" | grep -qiE 'co-authored-by:.*claude|generated with.*claude|claude\.com/claude-code'; then
            echo "::error::tool attribution found in a PR commit message"; exit 1
          fi
