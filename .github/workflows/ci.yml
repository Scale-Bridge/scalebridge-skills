name: CI
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard factory configuration paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE...$HEAD" -- '.github/workflows/' '.claude/' 'pnpm-workspace.yaml' 'stryker.conf.json' | head -20)
          if [ -n "$CHANGED" ]; then
            echo "::error::PR modifies protected gate/config paths:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Verify factory skill scaffold
        run: |
          set -euo pipefail
          required=(
            .claude/skills/bulletproof/SKILL.md
            .claude/skills/domain-modeling/SKILL.md
            .claude/skills/implement/SKILL.md
            .claude/skills/tdd/SKILL.md
            .claude/skills/tdd/tests.md
            .claude/skills/tdd/mocking.md
            .claude/skills/diagnosing-bugs/SKILL.md
            .claude/skills/diagnosing-bugs/scripts/hitl-loop.template.sh
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::missing factory scaffold file: $file"; exit 1; }
          done

      - name: Install pinned Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.211
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Validate plugin and marketplace
        run: |
          set -euo pipefail
          claude plugin validate . --strict
          jq . .claude-plugin/plugin.json >/dev/null
          jq . .claude-plugin/marketplace.json >/dev/null
          jq -e '.name == "scalebridge" and .version == "1.0.0" and .author.name == "ScaleBridge"' .claude-plugin/plugin.json >/dev/null
          jq -e '.name == "scalebridge" and .plugins | length == 1' .claude-plugin/marketplace.json >/dev/null
          test "$(jq -r '.version' .claude-plugin/plugin.json)" = "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          test "$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)" = "./"
          test ! -e hooks

      - name: Validate skill and agent frontmatter
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          skills=(skills/*/SKILL.md)
          agents=(agents/*.md)
          for file in "${skills[@]}" "${agents[@]}"; do
            awk 'NR==1&&$0!="---"{exit 3} /^name:/{n=1} /^description:/{d=1} END{exit (n&&d)?0:4}' "$file" \
              || { echo "::error::$file requires name and description frontmatter"; exit 1; }
          done
          echo "validated ${#skills[@]} skills and ${#agents[@]} agents"

      - name: Validate shell when present
        run: |
          if [ -e scripts/sync-hermes.sh ]; then
            shellcheck scripts/sync-hermes.sh
            bash -n scripts/sync-hermes.sh
          else
            echo "sync script is staged for a later milestone"
          fi

      - name: Verify repository policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          jq -e '.attribution.commit == "" and .attribution.pr == "" and .attribution.sessionUrl == false' .claude/settings.json >/dev/null
          test -s LICENSE
          grep -q 'Claude Code' README.md
          grep -q 'mattpocock/skills' README.md
          if git log --format='%s%n%b' | grep -qi 'claude'; then
            echo "::error::tool name found in commit messages or trailers"
            exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -qi 'claude'; then
            echo "::error::tool name found in pull request body"
            exit 1
          fi

      - name: Scan public repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
