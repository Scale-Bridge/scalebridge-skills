name: Claude QA
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      criteria: ${{ steps.parse.outputs.criteria }}
    steps:
      - name: Parse acceptance criteria from the linked issue
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ISSUE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          BODY=""
          [ -n "$ISSUE" ] && BODY=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          CRIT=$(printf '%s\n' "$BODY" | awk '/^## Acceptance criteria/{f=1;next} /^## /{f=0} f' | grep -E '^- \[.\]' | sed 's/^- \[.\] *//' | head -8 | jq -R . | jq -cs .)
          if [ -z "$CRIT" ] || [ "$CRIT" = "[]" ]; then
            CRIT='["Full verification of the linked issue acceptance criteria and the repository verification pipeline"]'
          fi
          CRIT=$(printf '%s' "$CRIT" | jq -c '. + ["SPEC-AXIS (whole-diff review, not code execution): the diff does exactly what the linked issue asked — every Constraint honored, nothing under Out of scope touched, no unrequested scope creep, and no acceptance criterion or constraint silently dropped. Evidence = cited gh pr diff hunks vs issue excerpts. FAIL on any drift."]')
          echo "criteria=$CRIT" >> "$GITHUB_OUTPUT"

  qa-leg:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        criterion: ${{ fromJSON(needs.plan.outputs.criteria) }}
        sample: [1, 2]
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Allocate verdict path
        id: vp
        run: echo "path=$RUNNER_TEMP/verdict-$RANDOM$RANDOM$RANDOM.md" >> "$GITHUB_OUTPUT"
      - name: Run QA leg
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_AUTO_COMPACT: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],claude,github-actions[bot],github-actions"
          prompt: >-
            ${{ format('You are one independent leg of the QA gate for PR #{0}. Before anything else, write {1} with first line `VERDICT: FAIL`, a blank line, and `leg in progress — premature end if this remains`; overwrite it at the end. Read the PR diff, linked issue, CLAUDE.md, CONTEXT.md, and KNOWN-FINDINGS.md. Verify exactly one criterion, shown at the end. For a behavioral criterion, execute the relevant commands, create and run targeted temporary checks when needed, and probe both success and failure cases. For the SPEC-AXIS criterion, cite diff hunks against issue text. Do not modify source or post reviews. Budget time to finish the verdict file. Its first line must be exactly `VERDICT: PASS` or `VERDICT: FAIL`, followed by a blank line and concrete evidence. PASS only on executed proof. YOUR CRITERION: {2}', github.event.pull_request.number, steps.vp.outputs.path, matrix.criterion) }}
          claude_args: |
            --model claude-opus-5
            --effort high
            --max-turns 60
            --allowedTools "Skill,Read,Glob,Grep,Write,Edit,Bash"
      - name: Collect leg verdict
        if: ${{ !cancelled() }}
        env:
          F: ${{ steps.vp.outputs.path }}
          CRIT: ${{ matrix.criterion }}
        run: |
          mkdir -p out
          DEST="out/verdict-${{ strategy.job-index }}.md"
          if [ -z "$F" ] || [ ! -f "$F" ] || ! head -1 "$F" | grep -qE '^VERDICT: (PASS|FAIL)$'; then
            printf 'VERDICT: FAIL\n\nno valid verdict produced (fail-closed). Criterion: %s\nRun: %s/%s/actions/runs/%s\n' "$CRIT" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > "$DEST"
            echo "::error::leg fail-closed"
          else
            { printf 'CRITERION: %s\n' "$CRIT"; cat "$F"; } > "$DEST"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: qa-verdict-${{ strategy.job-index }}
          path: out/
          retention-days: 7
      - name: Leg status
        if: ${{ !cancelled() }}
        run: grep -q '^VERDICT: PASS$' "out/verdict-${{ strategy.job-index }}.md"

  qa:
    needs: [plan, qa-leg]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-verdict-*
          path: verdicts
          merge-multiple: true
      - name: Aggregate and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LEGS: ${{ needs.qa-leg.result }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "QA gate (per-criterion legs):"
            echo
            for f in verdicts/verdict-*.md; do [ -f "$f" ] || continue; echo "---"; cat "$f"; echo; done
          } > "$BODY_FILE"
          if [ "$LEGS" = "success" ]; then
            for RID in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | select(.user.login=="github-actions[bot]" and .state=="CHANGES_REQUESTED") | .id'); do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$RID/dismissals" -f message="superseded by passing QA legs" -f event="DISMISS" || true
            done
            { echo "QA gate: PASS (all legs)"; echo; cat "$BODY_FILE"; } | gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --comment --body-file - || true
          else
            { echo "QA gate: REQUEST CHANGES (one or more legs failed)"; echo; cat "$BODY_FILE"; } | gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --request-changes --body-file - || true
            exit 1
          fi

  security:
    needs: [plan, qa-leg]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.qa-leg.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Allocate verdict path
        id: vp
        run: echo "path=$RUNNER_TEMP/verdict-$RANDOM$RANDOM$RANDOM.md" >> "$GITHUB_OUTPUT"
      - name: Run security reviewer
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          DISABLE_AUTO_COMPACT: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],claude,github-actions[bot],github-actions"
          prompt: >-
            ${{ format('You are the security gate for PR #{0}. Review the full diff plus enough surrounding content to judge it. Read KNOWN-FINDINGS.md and do not re-flag accepted findings. Hunt for prompt injection, secret exposure, unsafe shell behavior, path traversal, untrusted-source execution, supply-chain risk, permission widening, unsafe defaults, and changes to protected factory paths. Require primary-source or probe evidence for external facts. For each finding give severity, exact location, and exploit or failure sketch. Write the verdict only to {1}: first line exactly `VERDICT: PASS` or `VERDICT: FAIL`, a blank line, then evidence. PASS only with zero high or critical findings. Modify nothing and post nothing.', github.event.pull_request.number, steps.vp.outputs.path) }}
          claude_args: |
            --model claude-fable-5
            --effort max
            --max-turns 40
            --allowedTools "Skill,Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
      - name: Publish verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          F: ${{ steps.vp.outputs.path }}
        run: |
          if [ -z "$F" ] || [ ! -f "$F" ] || ! head -1 "$F" | grep -qE '^VERDICT: (PASS|FAIL)$'; then
            gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --request-changes --body "Security gate: no valid verdict (fail-closed)." || true
            exit 1
          fi
          V=$(head -1 "$F"); BODY=$(tail -n +3 "$F")
          if [ "$V" = "VERDICT: FAIL" ]; then
            printf 'Security gate: REQUEST CHANGES\n\n%s' "$BODY" | gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --request-changes --body-file - || true
            exit 1
          fi
          for RID in $(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | select(.user.login=="github-actions[bot]" and .state=="CHANGES_REQUESTED") | .id'); do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews/$RID/dismissals" -f message="superseded by passing security run" -f event="DISMISS" || true
          done
          printf 'Security gate: PASS\n\n%s' "$BODY" | gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --comment --body-file - || true
